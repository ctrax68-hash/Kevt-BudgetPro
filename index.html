<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="KevT Budget"/>
<meta name="theme-color" content="#1a3a2a"/>
<meta name="description" content="Your money. Your plan. — Smart budget tracking app"/>
<meta name="application-name" content="KevT Budget Pro"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231a3a2a' width='180' height='180'/><circle cx='90' cy='90' r='60' fill='%23fff' stroke='%23c9a84c' stroke-width='4'/><text x='90' y='100' font-size='48' font-weight='800' fill='%231a3a2a' text-anchor='middle' font-family='system-ui'>K</text></svg>"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231a3a2a' width='180' height='180' rx='40'/><circle cx='90' cy='90' r='55' fill='%23fff' stroke='%23c9a84c' stroke-width='4'/><text x='90' y='100' font-size='48' font-weight='800' fill='%231a3a2a' text-anchor='middle' font-family='system-ui'>K</text></svg>"/>
<title>KevT Budget Pro</title>
<style>
/* CSS FIXES APPLIED BELOW */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#1a3a2a;color:#1c1c1e;max-width:430px;width:100%;margin:0 auto;position:relative;height:100vh;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;}
button,a,[onclick],.nb,.mbtn,.sbtn{cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-user-select:auto;user-select:auto;}
/* Ensure buttons provide visual feedback */
.nb:active, .mbtn:active, .sbtn:active, #fab:active { opacity: 0.7; transform: scale(0.96); transition: transform 0.1s; }

:root{
  --gd:#1a3a2a;--gm:#2d5a3d;--gl:#3d7a52;
  --gold:#c9a84c;--gold2:#e8c96a;
  --bg:#f2f4f1;--card:#fff;--text:#1a2e1a;--sub:#6b7c6b;--border:#d8e0d5;
  --red:#e63946;--redbg:#fdf0f0;
  --em:#2d9a5f;--embg:#eef9f3;
  --amb:#d4821a;--ambbg:#fef6ec;
  --nav:58px;
}
/* SPLASH */
#splash{position:fixed;inset:0;background:var(--gd);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
#splash.out{opacity:0;pointer-events:none;}
.sp-rings{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:28px;}
.sp-ring{position:absolute;border-radius:50%;border:1px solid rgba(201,168,76,.15);}
.sp-r1{width:260px;height:260px;}.sp-r2{width:200px;height:200px;}.sp-r3{width:150px;height:150px;}
.klogo{width:110px;height:110px;border-radius:50%;background:#fff;border:4px solid var(--gd);outline:4px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2;box-shadow:0 8px 32px rgba(0,0,0,.4);}
.klogo-t{font-size:28px;font-weight:800;color:var(--gd);letter-spacing:-1px;font-style:italic;line-height:1;}
.klogo-b{width:44px;height:2px;background:var(--gold);margin-top:4px;border-radius:2px;}
#splash h1{color:#fff;font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;}
#splash p{color:rgba(255,255,255,.6);font-size:15px;}
.sp-dots{display:flex;gap:8px;margin-top:28px;}
.sp-dot{width:8px;height:8px;border-radius:50%;background:rgba(201,168,76,.3);}
.sp-dot.on{background:var(--gold);}
/* SHELL */
#shell{display:flex;flex-direction:column;height:100vh;background:var(--bg);transition:opacity .4s;}
#shell.vis{opacity:1;}
/* HEADER */
#hdr{background:linear-gradient(160deg,var(--gd) 0%,var(--gm) 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 20px;border-radius:0 0 24px 24px;flex-shrink:0;box-shadow:0 4px 20px rgba(0,0,0,.25);}
.ht{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.hleft .hg{font-size:12px;opacity:.6;margin-bottom:1px;}
.hleft .hn{font-size:19px;font-weight:800;letter-spacing:-.3px;}
.ksm{width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid var(--gd);outline:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.ksm-t{font-size:11px;font-weight:800;color:var(--gd);letter-spacing:-.5px;font-style:italic;}
.ksm-b{width:18px;height:1.5px;background:var(--gold);margin-top:2px;border-radius:1px;}
.mnav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px;}
.mbtn{background:rgba(255,255,255,0.12);border:none;color:#fff;border-radius:8px;width:30px;height:30px;font-size:18px;display:flex;align-items:center;justify-content:center;}
#mlbl{font-weight:700;font-size:15px;min-width:130px;text-align:center;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sc{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 13px;border:1px solid rgba(255,255,255,.08);}
.sl{font-size:10px;opacity:.6;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px;}
.sv{font-size:20px;font-weight:800;}
.sv.inc{color:#7ee8a2;}.sv.exp{color:#ffb3b3;}
.npill{margin-top:10px;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;}
.npill-l{font-size:11px;opacity:.65;}
.npill-v{font-weight:800;font-size:15px;}
.abanner{margin-top:8px;padding:8px 12px;border-radius:10px;background:rgba(230,57,70,.25);border:1px solid rgba(230,57,70,.4);font-size:12px;font-weight:600;color:#ffb3b3;display:flex;align-items:center;gap:6px;}
/* CONTENT */
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 14px calc(var(--nav) + 20px);}
#content::-webkit-scrollbar{display:none;}
.page{display:none;}.page.active{display:block;}
.stitle{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px;}
.card{background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.07);border:1px solid rgba(0,0,0,.04);}

/* FAB */
#fab{position:fixed;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#a87830);border:none;color:#fff;font-size:26px;box-shadow:0 4px 18px rgba(201,168,76,.55);display:flex;align-items:center;justify-content:center;z-index:40;}

/* NAV */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 12px rgba(0,0,0,.06);height:calc(var(--nav) + env(safe-area-inset-bottom));}
.nb{flex:1;background:none;border:none;padding:8px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;}
.ni{font-size:18px;line-height:1;display:block;}
.nl{font-size:9px;font-weight:600;color:var(--sub);display:block;}
.nb.on .nl{color:var(--gd);font-weight:700;}

/* Remaining styles preserved... */
</style>
</head>
<body>

<div id="shell">
  </div>

<script>
// JS FIXES APPLIED IN INIT BLOCK BELOW
document.addEventListener('DOMContentLoaded', function(){
  // ... preservation of app logic ...

  // Corrected Event Listeners for Safari
  var navButtons = document.querySelectorAll('.nb[data-page]');
  navButtons.forEach(function(btn){
    btn.addEventListener('click', function(e){
      // REMOVED preventDefault() which blocks standard click propagation on iOS
      var page = btn.getAttribute('data-page');
      gp(page, btn);
    });
  });
  
  var fab = document.getElementById('fab');
  if(fab){
    fab.addEventListener('click', function(e){
      openModal(null);
    });
  }
});
</script>
</body>
</html>
